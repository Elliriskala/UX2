<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuckHunt</title>
  </head>
  <style>
    html,
    body {
      min-height: 100vh;
      font-family: "Press Start 2P", cursive;
      margin: 0;
    }

    main {
      width: 800px;
      margin: auto;
    }

    .stage {
      width: 800px;
      height: 481px;
      background-image: url("stage.png");
      background-size: contain;
      position: relative;
    }

    .sonic {
      width: 150px;
      height: 200px;
      position: absolute;
      left: 70px;
      bottom: 30px;
      background-image: url("sonic2.png");
      background-position: 0 0;

      animation-name: dogwalks;
      animation-duration: 8s;
      /*animation-delay: 2s;*/
      animation-iteration-count: 1;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }
    @keyframes dogmove {
      from {
        left: 0px;
      }

      to {
        left: 300px;
      }
    }

    @keyframes dogwalks {
      0% {
        background-position: 0 0;
      }
      33% {
        background-position: -120px 0;
      }
      66% {
        background-position: -240px 0;
      }
      100% {
        background-position: 0 0;
      }
    }
  </style>
  <body>
    <main>
      <h1>Duckhunt</h1>
      <p>Tietoa duckhunt pelistä</p>
      <div class="stage">
        <div class="sonic"></div>
        <div class="duck">Ankka</div>
      </div>
    </main>
  </body>
</html>
