<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Duckhunt</title>
  </head>
  <style>
    html,
    body {
      min-height: 100vh;
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      background-color: rgb(56, 15, 95);
    }

    .header {
      text-align: center;
      margin-bottom: 2em;
    }

    .header h1 {
      font-size: 2.5em;
      color: rgb(199, 61, 185);
    }

    .header p {
      font-size: 1.5em;
      color: rgb(199, 61, 185);
    }

    .the-game {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stage {
      border-radius: 3em;
      width: 70%;
      height: 60vw;
      max-height: 481px;
      background-image: url("stage.png");
      background-size: contain;
      background-repeat: no-repeat;
      position: relative;
    }

    .dog {
      width: 120px;
      height: 110px;
      position: absolute;
      left: 70px;
      bottom: 30px;
      background-image: url("sprite.png");
      background-position: 0 0;

      /*
      animation-name: dogwalks;
      animation-duration: 0.5s;
      animation-delay: 2s;
      animation-iteration-count: 3;
      animation-timing-function: steps(5);
      */

      animation: dogwalks 0.5s steps(5) 6, dogmove 3s linear forwards,
        dogsniff 1s steps(2) 3s 3, dogSmellsDuck 1s steps(1) 6s,
        dogJumps 0.5s steps(1) 7s, dogJumps2 0.5s steps(1) 7.5s,
        dogFindsDuck 2s steps(1) 8s;
    }

    .duck {
      width: 80px;
      height: 80px;
      position: absolute;
      top: 50px;
      left: 600px;
      background-image: url("sprite.png");
      background-repeat: no-repeat;
      background-position: 10px -220px;
    }

    .duck-fly {
      animation: duckfly 1s steps(3) 10;
    }

    .duck2 {
      width: 80px;
      height: 80px;
      position: absolute;
      top: 100px;
      left: 200px;
      background-image: url("sprite.png");
      background-repeat: no-repeat;
      background-position: 10px -320px;
    }

    .duck2-fly {
      animation: duck2fly 1s steps(3) 10;
    }

    @keyframes dogmove {
      from {
        left: 0px;
      }

      to {
        left: 300px;
        bottom: 70px;
      }
    }

    @keyframes dogwalks {
      from {
        background-position: 0 0;
      }

      to {
        background-position: -600px 0;
      }
    }

    @keyframes dogsniff {
      from {
        background-position: -360px 0;
      }

      to {
        background-position: -600px 0;
      }
    }

    @keyframes dogSmellsDuck {
      from {
        background-position: 0 -110px;
      }

      to {
        background-position: 0 -110px;
      }
    }

    @keyframes dogJumps {
      from {
        background-position: -120px -110px;
      }

      to {
        background-position: -120px -110px;
      }
    }

    @keyframes dogJumps2 {
      from {
        background-position: -240px -110px;
      }

      to {
        background-position: -240px -110px;
      }
    }

    @keyframes dogFindsDuck {
      from {
        background-position: -640px -120px;
        bottom: 100px;
      }

      to {
        background-position: -720px 120px;
      }
    }

    @keyframes duckfly {
      0% {
        background-position: 10px -220px;
        bottom: 200px;
      }

      100% {
        background-position: -230px -210px;
        top: 100px;
      }
    }

    @keyframes duck2fly {
      0% {
        background-position: 340px -320px;
        bottom: 50px;
      }

      100% {
        background-position: 500px -320px;
        top: 100px;
      }
    }
  </style>
  <body>
    <main>
      <div class="header">
        <h1>DUCKHUNT GAME</h1>
        <p>In this game the dog catches the ducks</p>
      </div>
      <div class="the-game">
        <div class="stage">
          <div class="dog"></div>
          <div class="duck duck-fly"></div>
          <div class="duck2 duck2-fly"></div>
        </div>
      </div>
      <div id="output"></div>
    </main>
    <script>
      let dog = document.querySelector(".dog");

      dog.addEventListener("animationstart", listener, false);
      dog.addEventListener("animationend", listener, false);
      dog.addEventListener("animationiteration", listener, false);
      /*
      function listener(event) {
        const l = document.createElement("li");
        switch (event.type) {
          case "animationstart":
            l.textContent = `${event.animationName} started: elapsed time is ${event.elapsedTime}`;
            break;
          case "animationend":
            l.textContent = `${event.animationName} ended: elapsed time is ${event.elapsedTime}`;
            break;
          case "animationiteration":
            l.textContent = `${event.animationName} new loop started at time ${event.elapsedTime}`;
            break;
        }
        document.getElementById("output").appendChild(l);
      }
        */
    </script>
  </body>
</html>
