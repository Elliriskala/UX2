<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuckHunt</title>
  </head>
  <style>
    html,
    body {
      min-height: 100vh;
      font-family: "Press Start 2P", cursive;
      margin: 0;
    }

    main {
      width: 800px;
      margin: auto;
    }

    .stage {
      width: 800px;
      height: 481px;
      background-image: url("stage.png");
      background-size: contain;
      position: relative;
    }

    .dog {
      width: 120px;
      height: 110px;
      position: absolute;
      left: 70px;
      bottom: 30px;
      background-image: url("sprite.png");
      background-position: 0 0;

      animation-name: dogwalks;
      animation-duration: 8s;
      /*animation-delay: 2s;*/
      animation-iteration-count: 2;
      animation-timing-function: linear;
    }

    @keyframes dogwalks {
      0% {
        left: 0px;
        bottom: 40px;
      }

      50% {
        left: 50px;
        bottom: 60px;
      }

      100% {
        left: 300px;
        bottom: 30px;
      }
    }
  </style>
  <body>
    <main>
      <h1>Duckhunt</h1>
      <p>Tietoa duckhunt pelistä</p>
      <div class="stage">
        <div class="dog"></div>
        <div class="duck">Ankka</div>
      </div>
    </main>
  </body>
</html>
